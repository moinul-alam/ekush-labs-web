<!DOCTYPE html>
<html lang="bn">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ekush Ponji — Bangla Calendar</title>
  <meta name="description" content="Bangla calendar with Gregorian, Bangla and Hijri dates, Bangladesh government holidays, and more.">

  <!-- Theme before first paint — prevents flash -->
  <script>
    (function () {
      var t = localStorage.getItem('ekush_theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
      if (t === 'dark') document.documentElement.classList.add('dark');
    })();
  </script>

  <link rel="stylesheet" href="../shared/css/design-tokens.css">
  <link rel="stylesheet" href="../shared/css/reset.css">
  <link rel="stylesheet" href="../shared/css/components.css">
  <link rel="stylesheet" href="../shared/css/app-shell.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <!-- Static navbar — calendar controls its own bilingual navbar.
       loader.js only injects the footer for this page. -->
  <nav id="navbar">
    <a href="../index.html" class="nav-back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
        <path d="M19 12H5M12 5l-7 7 7 7"/>
      </svg>
      <span>Back</span>
    </a>

    <div class="nav-brand" style="position:absolute;left:50%;transform:translateX(-50%);">
      <span class="nav-name" id="nav-title" style="display:flex;flex-direction:column;align-items:center;">
        <span id="nav-main-title">
          <span class="nav-ekush" style="color:#D32F2F;">Ekush</span>
          <span class="nav-ponji-text" style="color:#006B54;">Ponji</span>
          <span class="nav-cal-text" id="nav-cal-title"
            style="color:var(--text-primary,#111);font-weight:700;font-family:var(--font-display),'Syne',sans-serif;font-size:1.5rem;letter-spacing:0.02em;">Bangla Calendar</span>
        </span>
        <!-- <span id="nav-sub-title"
          style="font-size:0.85rem;color:var(--text-secondary,#666);font-weight:normal;text-align:center;margin-top:4px;">
          English, Bangla &amp; Hijri Dates with Holidays
        </span> -->
      </span>
    </div>

    <ul class="nav-links" style="list-style:none;display:flex;gap:0.75rem;align-items:center;padding:0;margin:0;">
      <li class="nav-controls" style="display:flex;gap:8px;align-items:center;">
        <button class="nav-btn-icon" id="lang-toggle" title="Switch Language">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <line x1="2" y1="12" x2="22" y2="12"/>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
          </svg>
        </button>
        <button class="nav-btn-icon" id="theme-toggle" title="Toggle Dark Mode">
          <svg class="theme-icon theme-icon--light" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
          <svg class="theme-icon theme-icon--dark theme-icon-hidden" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
      </li>
    </ul>
  </nav>

  <main class="calendar-wrapper">
    <div class="content-layout">

      <!-- Left Column: Calendar -->
      <div class="left-column">
        <div class="calendar-container">
          <div class="calendar-header">
            <button class="nav-btn" id="prev-month">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M15 18l-6-6 6-6"/>
              </svg>
              <span class="prev-txt">আগে</span>
            </button>
            <div class="header-center">
              <h2 id="current-month-year">Month Year</h2>
              <p class="header-sub" id="current-month-sub">Sub Months</p>
            </div>
            <button class="nav-btn" id="next-month">
              <span class="next-txt">পরে</span>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 18l6-6-6-6"/>
              </svg>
            </button>
          </div>
          <div class="calendar-grid" id="calendar-weekdays"></div>
          <div class="calendar-grid" id="calendar-days"></div>
        </div>
      </div>

      <!-- Right Column: Widgets -->
      <div class="right-column">
        <div class="widget today-widget">
          <div class="widget-header">
            <span class="widget-icon">📅</span>
            <h3 id="today-widget-title">আজ</h3>
          </div>
          <div class="today-dates">
            <div class="today-item gregorian">
              <span class="date-value" id="today-gregorian"></span>
            </div>
            <div class="today-item bangla">
              <span class="date-value" id="today-bangla"></span>
            </div>
            <div class="today-item hijri">
              <span class="date-value" id="today-hijri"></span>
            </div>
          </div>
        </div>

        <div class="widget holidays-widget">
          <div class="widget-header">
            <span class="widget-icon">🎉</span>
            <h3 id="holiday-list-title">এই মাসের ছুটির দিন</h3>
          </div>
          <ul class="holiday-list" id="holiday-list"></ul>
        </div>
      </div>
    </div>

    <!-- Bottom CTA -->
    <div class="bottom-cta">
      <h2 id="bottom-cta-title">একুশ পঞ্জি অ্যাপ ডাউনলোড করুন</h2>
      <p id="bottom-cta-desc">ক্যালেন্ডার, ছুটি, ইভেন্ট, রিমাইন্ডার, বয়স ক্যালকুলেটর, দৈনিক উক্তি এবং আরও অনেক কিছু!</p>
      <a href="https://play.google.com/store/apps/details?id=com.ekushlabs.ponji"
         target="_blank" rel="noopener noreferrer" class="bottom-cta-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M3,20.5V3.5C3,2.91 3.34,2.39 3.84,2.15L13.69,12L3.84,21.85C3.34,21.6 3,21.09 3,20.5M16.81,15.12L6.05,21.34L14.54,12.85L16.81,15.12M20.16,12L17.89,9.73L6.05,1.66L16.81,7.88L18.86,9.04C20.09,9.74 20.84,10.82 20.84,12C20.84,13.18 20.09,14.26 18.86,14.96L16.81,16.12L20.16,12Z"/>
        </svg>
        <span id="bottom-cta-btn-text">একুশ পঞ্জি অ্যাপ ডাউনলোড করুন</span>
      </a>
    </div>
  </main>

  <!-- FAB CTA -->
  <a href="https://play.google.com/store/apps/details?id=com.ekushlabs.ponji"
     target="_blank" rel="noopener noreferrer" class="fab-cta">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
      <path d="M3,20.5V3.5C3,2.91 3.34,2.39 3.84,2.15L13.69,12L3.84,21.85C3.34,21.6 3,21.09 3,20.5M16.81,15.12L6.05,21.34L14.54,12.85L16.81,15.12M20.16,12L17.89,9.73L6.05,1.66L16.81,7.88L18.86,9.04C20.09,9.74 20.84,10.82 20.84,12C20.84,13.18 20.09,14.26 18.86,14.96L16.81,16.12L20.16,12Z"/>
    </svg>
    <span id="fab-cta-text">একুশ পঞ্জি অ্যাপ ডাউনলোড করুন</span>
  </a>

  <!-- Footer only — loader.js skips navbar injection here -->
  <div id="footer-placeholder"
       data-shared-root="../shared"
       data-app-name="Ekush Ponji"></div>

  <!-- Load order matters: theme → loader → calendar -->
  <script src="../shared/js/theme.js"></script>
  <script src="../shared/js/loader.js"></script>
  <script src="calendar.js"></script>
</body>

</html>
