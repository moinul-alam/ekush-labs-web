<!DOCTYPE html>
<html lang="bn">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ekush Ponji - Bangla Calendar</title>
  <meta name="description" content="Calendar, Holidays and more">

  <!-- Apply theme FIRST, before any other content loads -->
  <script>
    (function () {
      const theme = localStorage.getItem('ekush_theme') || 'light';
      if (theme === 'dark') {
        document.documentElement.classList.add('dark');
        document.documentElement.dataset.theme = 'dark';
        document.body.classList.add('dark');
      } else {
        document.documentElement.dataset.theme = 'light';
      }
    })();
  </script>

  <link rel="stylesheet" href="../shared/css/design-tokens.css">
  <link rel="stylesheet" href="../shared/css/reset.css">
  <link rel="stylesheet" href="../shared/css/components.css">
  <link rel="stylesheet" href="../shared/css/main.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <div id="navbar-placeholder" data-app-name="Ekush Ponji"></div>

  <main class="calendar-wrapper">
    <div class="content-layout">
      <!-- Left Column (Calendar) -->
      <div class="left-column">
        <div class="calendar-container">
          <div class="calendar-header">
            <button class="nav-btn" id="prev-month">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M15 18l-6-6 6-6" />
              </svg>
              <span class="prev-txt">আগে</span>
            </button>
            <div class="header-center">
              <h2 id="current-month-year">Month Year</h2>
              <p class="header-sub" id="current-month-sub">Sub Months</p>
            </div>
            <button class="nav-btn" id="next-month">
              <span class="next-txt">পরে</span>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 18l6-6-6-6" />
              </svg>
            </button>
          </div>

          <div class="calendar-grid" id="calendar-weekdays">
            <!-- Weekdays will be generated by JS -->
          </div>

          <div class="calendar-grid" id="calendar-days">
            <!-- Days will be generated by JS -->
          </div>
        </div>
      </div>

      <!-- Right Column (Widgets) -->
      <div class="right-column">
        <!-- Today's Date Widget -->
        <div class="widget today-widget">
          <div class="widget-header">
            <span class="widget-icon">📅</span>
            <h3 id="today-widget-title">Today</h3>
          </div>
          <div class="today-dates">
            <div class="today-item gregorian">
              <span class="date-value" id="today-gregorian">01 January 2025</span>
            </div>
            <div class="today-item bangla">
              <span class="date-value" id="today-bangla">01 Baishakh 1432</span>
            </div>
            <div class="today-item hijri">
              <span class="date-value" id="today-hijri">01 Muharram 1447</span>
            </div>
          </div>
        </div>

        <!-- Holidays Widget -->
        <div class="widget holidays-widget">
          <div class="widget-header">
            <span class="widget-icon">🎉</span>
            <h3 id="holiday-list-title">Holidays this month</h3>
          </div>
          <ul class="holiday-list" id="holiday-list">
            <!-- Holidays populated here -->
          </ul>
        </div>
      </div>
    </div>

    <!-- Bottom CTA Section -->
    <div class="bottom-cta">
      <h2 id="bottom-cta-title">Get the Ekush Ponji App</h2>
      <p id="bottom-cta-desc">Get updated with Calendar, Holidays, Events, Reminders, Age Calculator, Daily Quote, Daily
        Words and more!</p>
      <a href="https://play.google.com/store/apps/details?id=com.ekushlabs.ponji" target="_blank"
        class="bottom-cta-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M3,20.5V3.5C3,2.91 3.34,2.39 3.84,2.15L13.69,12L3.84,21.85C3.34,21.6 3,21.09 3,20.5M16.81,15.12L6.05,21.34L14.54,12.85L16.81,15.12M20.16,12L17.89,9.73L6.05,1.66L16.81,7.88L18.86,9.04C20.09,9.74 20.84,10.82 20.84,12C20.84,13.18 20.09,14.26 18.86,14.96L16.81,16.12L20.16,12Z" />
        </svg>
        <span id="bottom-cta-btn-text">Get Ekush Ponji App</span>
      </a>
    </div>
  </main>

  <!-- FAB CTA -->
  <a href="https://play.google.com/store/apps/details?id=com.ekushlabs.ponji" target="_blank" class="fab-cta">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
      <path
        d="M3,20.5V3.5C3,2.91 3.34,2.39 3.84,2.15L13.69,12L3.84,21.85C3.34,21.6 3,21.09 3,20.5M16.81,15.12L6.05,21.34L14.54,12.85L16.81,15.12M20.16,12L17.89,9.73L6.05,1.66L16.81,7.88L18.86,9.04C20.09,9.74 20.84,10.82 20.84,12C20.84,13.18 20.09,14.26 18.86,14.96L16.81,16.12L20.16,12Z" />
    </svg>
    <span id="fab-cta-text">Get Ekush Ponji App</span>
  </a>

  <div id="footer-placeholder" data-app-name="Ekush Ponji"></div>

  <script src="../shared/js/loader.js" defer></script>
  <script src="calendar.js" defer></script>
</body>

</html>
