<!DOCTYPE html>
<html lang="bn">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ekush Ponji - Bangla Calendar</title>
  <meta name="description" content="Calendar, Holidays and more">

  <link rel="stylesheet" href="../shared/css/design-tokens.css">
  <link rel="stylesheet" href="../shared/css/reset.css">
  <link rel="stylesheet" href="../shared/css/components.css">
  <link rel="stylesheet" href="../shared/css/main.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <div id="navbar-placeholder" data-app-name="Ekush Ponji Bangla Calendar"></div>

  <main class="calendar-wrapper">

    <div class="calendar-container">
      <div class="calendar-header">
        <button class="nav-btn" id="prev-month">&larr; <span class="prev-txt">আগে</span></button>
        <div class="header-center">
          <h2 id="current-month-year">Month Year</h2>
          <p class="header-sub" id="current-month-sub">Sub Months</p>
        </div>
        <button class="nav-btn" id="next-month"><span class="next-txt">পরে</span> &rarr;</button>
      </div>

      <div class="calendar-grid" id="calendar-weekdays">
        <!-- Weekdays will be generated by JS -->
      </div>

      <div class="calendar-grid" id="calendar-days">
        <!-- Days will be generated by JS -->
      </div>
    </div>

    <div class="holiday-list-container">
      <h3 class="holiday-list-title" id="holiday-list-title">এই মাসের ছুটির দিন</h3>
      <ul class="holiday-list" id="holiday-list">
        <!-- Holidays populated here -->
      </ul>
    </div>

    <div class="cta-banner">
      <div class="cta-text">
        <h3 id="cta-title">পূর্ণ অভিজ্ঞতার জন্য Ekush Ponji ডাউনলোড করুন</h3>
        <p id="cta-sub">Get reminders, age calculator & more</p>
      </div>
      <a href="https://play.google.com/store/apps/details?id=com.ekushlabs.ponji" target="_blank" class="cta-button"
        id="cta-btn">Download on Google Play</a>
    </div>
  </main>

  <div id="footer-placeholder" data-app-name="Ekush Ponji"></div>

  <script src="../shared/js/loader.js" defer></script>
  <script src="calendar.js" defer></script>
</body>

</html>
