<!-- ============================================================
   Ekush Labs Shared Component — footer.html
   Consistent responsive footer. Dark mode handled here via
   CSS variables — no extra stylesheet needed.
============================================================ -->
<footer id="footer">
  <style>
    #footer {
      padding: 2rem 5vw;
      border-top: 1px solid var(--glass-border, rgba(0,0,0,0.08));
      background: var(--navy-mid, #f1f5f9);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      position: relative;
      z-index: 1;
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    .footer-brand {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--white, #0f172a);
      text-decoration: none;
      letter-spacing: -0.01em;
    }

    .brand-labs { display: inline-flex; gap: 2px; }

    .brand-accent {
      background: linear-gradient(to right, var(--primary-start, #1D5BFD), var(--primary-end, #06B6D4));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .footer-app-label {
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--silver, #64748b);
    }

    .footer-copy {
      font-size: 0.78rem;
      color: var(--text-muted, #94a3b8);
    }

    @media (max-width: 768px) {
      #footer {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.5rem;
      }
    }
  </style>

  <div class="footer-brand-container">
    <a href="https://ekushlabs.com" class="footer-brand">
      <span class="brand-labs">Ekush<span class="brand-accent">Labs</span></span>
    </a>
  </div>

  <div class="footer-desc-container">
    <span class="footer-app-label">An Ekush Labs Product</span>
  </div>

  <div class="footer-copy-container">
    <span class="footer-copy">© <span id="footer-year"></span> EkushLabs. All rights reserved.</span>
  </div>
</footer>
